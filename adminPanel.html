<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="adminPanelStyle.css">
    <title>Admin Panel</title>
</head>
<body>
    <div id="menuGlowne">
        <h1>Panel admina Aleje news</h1>
        <button onclick="zmienWidok('dodajNewsa')">Dodaj newsa</button>
        <button onclick="zmienWidok('baza')"> Wyswietl baze </button>
    </div>
    <div id="obszarRoboczy">
        <div id="dodajNewsa">
            <div id="formularz">
            <h1>Dodaj newsa</h1>
            <p>Rodzaj: </p>
            <select name="rodzaj" id="rodzaj">
                <option value="zdjecie">Zdjecie</option>
                <option value="wideo">Wideo</option>
                <option value="pytanie_testowe">Pytanie testowe</option>
            </select><br>
            <div type="media">
                <label for="tytul">Tytuł newsa:</label>
                <input type="text" id="tytul" name="tytul"><br>
                <label for="plik">Plik:</label>
                <input type="file" id="plik" name="plik"><br>
                <label for="opis">Opis:</label>
                <input type="text" id="opis" name="opis"><br>
                <label for="czasTrwania">Czas trwania (w sekundach):</label>
                <input type="number" id="czasTrwania" name="czasTrwania"><br>
                <button onclick="dodajNewsa()">Dodaj newsa</button>
            </div>
            <div type="pytanie_testowe" style="display: none;">
                <label for="czasTrwania">Czas trwania (w sekundach):</label>
                <input type="number" id="czasTrwania" name="czasTrwania"><br>
                <label for="trescPytania">Tresc pytania: </label>
                <input type="text" id="trescPytania" name="trescPytania"><br>
                <label for="odpA">Odpowiedz A: </label>
                <input type="text" id="odpA" name="odpA"><br>
                <label for="odpB">Odpowiedz B: </label>
                <input type="text" id="odpB" name="odpB"><br>
                <label for="odpC">Odpowiedz C: </label>
                <input type="text" id="odpC" name="odpC"><br>
                <label for="odpD">Odpowiedz D: </label>
                <input type="text" id="odpD" name="odpD"><br>
                <label for="poprawnaOdp">Poprawna odpowiedz: </label>
                <select name="poprawnaOdp" id="poprawnaOdp">
                    <option value="odpA">Odpowiedz A</option>
                    <option value="odpB">Odpowiedz B</option>
                    <option value="odpC">Odpowiedz C</option>
                    <option value="odpD">Odpowiedz D</option>
                </select><br>
                <button onclick="dodajNewsa()">Dodaj newsa</button>
            </div>
            </div>
        </div>
        <div id="baza" style="display: none;">
            <h1>Baza newsów</h1>
            <div id="tabelaBaza">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Rodzaj</th>
                            <th>Tytuł / Treść</th>
                        </tr>
                    </thead>
                    <tbody id="wierszeBazy"></tbody>
                </table>
            </div>
        </div>
        <div id="podglad">
            <iframe src="index.html?preview=true"></iframe>
            <button id="trybPytan" type="button" onclick="przelaczTrybPytan()">Zmień tryb pytań</button>
        </div>
    </div>
    <script>
        const previewFrame = document.querySelector('#podglad iframe');
        const trybPytan = document.getElementById('trybPytan');
        let previewVideoUrl = null;
        let pokazujOdpowiedz = false;
        let wybranyNewsZBazy = null;

        function dodajNewsa() {
            const rodzaj = document.getElementById('rodzaj').value;
            const formularz = document.querySelector('#formularz > div[type="' +
                (rodzaj === 'zdjecie' || rodzaj === 'wideo' ? 'media' : rodzaj) + '"]');
            const czasTrwania = parseInt(formularz.querySelector('[name="czasTrwania"]').value, 10);
            if (isNaN(czasTrwania) || czasTrwania <= 0) {
                alert('Czas trwania musi być liczbą większą od zera.');
                return;
            }
            const dane = new FormData();
            dane.append('rodzaj', rodzaj);
            dane.append('czasTrwania', czasTrwania);

            if (rodzaj === 'zdjecie' || rodzaj === 'wideo') {
                const tytul = formularz.querySelector('[name="tytul"]').value.trim();
                const opis = formularz.querySelector('[name="opis"]').value.trim();
                const plikInput = formularz.querySelector('[name="plik"]');
                const plik = plikInput.files[0];

                if (!tytul || !opis || !plik) {
                    alert('Wszystkie pola muszą być wypełnione.');
                    return;
                }

                dane.append('tytul', tytul);
                dane.append('opis', opis);
                dane.append('plik', plik);
            } else if (rodzaj === 'pytanie_testowe') {
                const trescPytania = formularz.querySelector('[name="trescPytania"]').value.trim();
                const odpA = formularz.querySelector('[name="odpA"]').value.trim();
                const odpB = formularz.querySelector('[name="odpB"]').value.trim();
                const odpC = formularz.querySelector('[name="odpC"]').value.trim();
                const odpD = formularz.querySelector('[name="odpD"]').value.trim();
                const poprawnaOdp = formularz.querySelector('[name="poprawnaOdp"]').value;

                if (!trescPytania || !odpA || !odpB || !odpC || !odpD) {
                    alert('Wszystkie pola muszą być wypełnione.');
                    return;
                }

                dane.append('trescPytania', trescPytania);
                dane.append('odpA', odpA);
                dane.append('odpB', odpB);
                dane.append('odpC', odpC);
                dane.append('odpD', odpD);
                dane.append('poprawnaOdp', poprawnaOdp);
            } else {
                alert('Nieznany rodzaj newsa.');
                return;
            }
            fetch('dodajNewsa.php', {
                method: 'POST',
                body: dane
            }).then((odpowiedz) => odpowiedz.text()).then((tekst) => {
                let wynik;
                try {
                    wynik = JSON.parse(tekst);
                } catch (blad) {
                    throw new Error('Serwer zwrócił nieprawidłową odpowiedź. Sprawdź limit rozmiaru pliku w PHP.');
                }
                if (!wynik.sukces) {
                    throw new Error(wynik.komunikat || 'Nie udało się dodać newsa.');
                }
                alert(wynik.komunikat);
                pobierzNewsyDoTabeli();
            }).catch((blad) => {
                alert('Błąd: ' + blad.message);
            });
        }

        function zmienWidok(widok) {
            document.getElementById('dodajNewsa').style.display = widok === 'dodajNewsa' ? '' : 'none';
            document.getElementById('baza').style.display = widok === 'baza' ? '' : 'none';
            document.getElementById('obszarRoboczy').classList.toggle('widok-bazy', widok === 'baza');
            if (widok === 'baza') {
                pobierzNewsyDoTabeli();
                if (wybranyNewsZBazy) {
                    updatePreview(wybranyNewsZBazy);
                } else {
                    updatePreview();
                }
            } else {
                wybranyNewsZBazy = null;
                pokazujOdpowiedz = false;
                updateFormFields();
                updatePreview();
            }
        }

        function pobierzNewsyDoTabeli() {
            const wiersze = document.getElementById('wierszeBazy');
            wiersze.innerHTML = '<tr><td colspan="3">Ładowanie danych...</td></tr>';

            fetch('pobierzBazeNewsow.php')
                .then((odpowiedz) => odpowiedz.json())
                .then((wynik) => {
                    if (!wynik.sukces) {
                        throw new Error(wynik.komunikat || 'Nie udało się pobrać danych.');
                    }

                    wiersze.innerHTML = '';
                    wynik.newsy.forEach((news) => {
                        const wiersz = document.createElement('tr');
                        const id = document.createElement('td');
                        const rodzaj = document.createElement('td');
                        const tresc = document.createElement('td');

                        id.textContent = news.id;
                        rodzaj.textContent = news.rodzaj;
                        tresc.textContent = news.tresc || '(brak treści)';
                        wiersz.append(id, rodzaj, tresc);
                        wiersz.classList.add('wiersz-newsa');
                        wiersz.addEventListener('click', () => {
                            wybranyNewsZBazy = news;
                            pokazujOdpowiedz = false;
                            updatePreview(news);
                        });
                        wiersze.appendChild(wiersz);
                    });
                })
                .catch((blad) => {
                    wiersze.innerHTML = '<tr><td colspan="3">Błąd: ' + blad.message + '</td></tr>';
                });
        }

        function updateFormFields() {
            const type = document.getElementById('rodzaj').value;
            document.querySelectorAll('#formularz > div[type]').forEach((section) => {
                const sectionType = section.getAttribute('type');
                const isMedia = sectionType === 'media' && (type === 'zdjecie' || type === 'wideo');
                section.style.display = isMedia || sectionType === type ? '' : 'none';
            });

            document.getElementById('plik').accept = type === 'wideo' ? 'video/*' : 'image/*';
        }

        function updatePreview(danePodgladu = null) {
            if (!previewFrame.contentDocument) return;

            const podglad = previewFrame.contentDocument;
            const rodzaj = danePodgladu ? danePodgladu.rodzaj : document.getElementById('rodzaj').value;
            const formularz = document.querySelector('[type="' +
                (rodzaj === 'zdjecie' || rodzaj === 'wideo' ? 'media' : rodzaj) + '"]');
            const daneFormularza = danePodgladu || {
                rodzaj: rodzaj,
                tytul: formularz.querySelector('[name="tytul"]')?.value || 'Tytul newsa',
                opis: formularz.querySelector('[name="opis"]')?.value || 'Opis newsa',
                plik: formularz.querySelector('[name="plik"]')?.files[0] || null,
                trescPytania: formularz.querySelector('[name="trescPytania"]')?.value || 'Tresc pytania',
                odpowiedzi: {
                    A: formularz.querySelector('[name="odpA"]')?.value || 'Odpowiedz A',
                    B: formularz.querySelector('[name="odpB"]')?.value || 'Odpowiedz B',
                    C: formularz.querySelector('[name="odpC"]')?.value || 'Odpowiedz C',
                    D: formularz.querySelector('[name="odpD"]')?.value || 'Odpowiedz D'
                },
                poprawnaOdpowiedz: formularz.querySelector('[name="poprawnaOdp"]')?.value.replace('odp', '') || ''
            };
            const dane = danePodgladu || daneFormularza;
            const tytulGlowny = podglad.getElementById('mainTitle');
            const podtytul = podglad.getElementById('subtitle');
            const pytanie = podglad.getElementById('question');
            const obraz = podglad.getElementById('mainImage');
            const wideo = podglad.getElementById('mainVideo');

            trybPytan.style.display = rodzaj === 'pytanie_testowe' ? 'inline-flex' : 'none';
            trybPytan.textContent = pokazujOdpowiedz
                ? 'Pokaż normalne odpowiedzi'
                : 'Pokaż poprawną odpowiedź';
            tytulGlowny.style.display = rodzaj === 'pytanie_testowe' ? 'none' : 'block';
            podtytul.style.display = rodzaj === 'pytanie_testowe' ? 'none' : 'block';
            tytulGlowny.querySelector('.scroll-text').textContent = dane.tytul || 'Tytul newsa';
            podtytul.querySelector('.scroll-text').textContent = dane.opis || 'Opis newsa';

            if (rodzaj === 'pytanie_testowe') {
                obraz.style.display = 'none';
                wideo.pause();
                wideo.style.display = 'none';
                pytanie.style.display = 'block';
                podglad.getElementById('questionText').textContent =
                    dane.pytanie || dane.trescPytania || 'Tresc pytania';
                ['A', 'B', 'C', 'D'].forEach((litera) => {
                    const odpowiedz = podglad.getElementById('answer' + litera);
                    if (odpowiedz) {
                        odpowiedz.textContent = litera + '. ' +
                            (dane.odpowiedzi[litera] || 'Odpowiedz ' + litera);
                        odpowiedz.className = 'answer';
                        if (pokazujOdpowiedz) {
                            odpowiedz.className = dane.poprawnaOdpowiedz === litera
                                || dane.poprawnaOdp === 'odp' + litera
                                ? 'correctAnswer' : 'wrongAnswer';
                        }
                    }
                });
            } else {
                pytanie.style.display = 'none';
                obraz.style.display = rodzaj === 'zdjecie' ? 'block' : 'none';
                wideo.style.display = rodzaj === 'wideo' ? 'block' : 'none';
                const plik = dane.plik || (rodzaj === 'zdjecie' ? 'aleje.jpg' : 'domanskiDance.mp4');

                if (rodzaj === 'zdjecie' && plik) {
                    if (plik instanceof File) {
                        const czytnik = new FileReader();
                        czytnik.addEventListener('load', () => { obraz.src = czytnik.result; });
                        czytnik.readAsDataURL(plik);
                    } else {
                        obraz.src = 'visuals/' + plik;
                    }
                }
                if (rodzaj === 'wideo' && plik) {
                    const zrodlo = wideo.querySelector('source');
                    const adres = plik instanceof File ? URL.createObjectURL(plik) : 'visuals/' + plik;
                    if (previewVideoUrl) URL.revokeObjectURL(previewVideoUrl);
                    previewVideoUrl = plik instanceof File ? adres : null;
                    zrodlo.src = adres;
                    zrodlo.type = plik.type || 'video/mp4';
                    wideo.loop = true;
                    wideo.muted = false;
                    wideo.volume = 1;
                    wideo.load();
                    wideo.play().catch((blad) => {
                        console.warn('Podgląd wideo wymaga uruchomienia przez użytkownika:', blad);
                    });
                }
            }
        }

        function przelaczTrybPytan() {
            pokazujOdpowiedz = !pokazujOdpowiedz;
            updatePreview(wybranyNewsZBazy);
        }

        document.getElementById('rodzaj').addEventListener('change', () => {
            updateFormFields();
            updatePreview();
        });
        document.querySelectorAll('#formularz input, #formularz select').forEach((field) => {
            field.addEventListener('input', () => {
                wybranyNewsZBazy = null;
                updatePreview();
            });
            field.addEventListener('change', () => {
                wybranyNewsZBazy = null;
                updatePreview();
            });
        });
        previewFrame.addEventListener('load', () => updatePreview(wybranyNewsZBazy));
        updateFormFields();
        zmienWidok('dodajNewsa');
    </script>
</body>
</html>
