<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleje News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="weatherWidget" class="hidden">
        <div class="weather-icon" id="weatherIcon">🌡️</div>
        <div class="weather-info">
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-desc" id="weatherDesc">Ładowanie...</div>
        </div>
    </div>

    <div id="visuals">
        <img src="visuals/aleje.jpg" id="mainImage">
        <video id="mainVideo" autoplay playsinline preload="auto" style="display:none" width="100%" height="100%">
            <source src="" type="video/mp4">
            Twoja przegladarka nie wspiera elementu vidoe
        </video>
        <div id="question" style="display:none">
            <h1 id="questionText">Tresc Pytania</h1>
            <div id="answers">
                <p id="answerA" class="answer">A. Odpowiedz</p>
                <p id="answerB" class="answer">B. Odpowiedz</p>
                <p id="answerC" class="answer">C. Odpowiedz</p>
                <p id="answerD" class="answer">D. Odpowiedz</p>
            </div>
        </div>
    </div>
    <div id="textContent">
        <h1 id="mainTitle">
            <span class="scroll-wrapper">
                <span class="scroll-text">Nowosci w BCU !</span>
            </span>
        </h1>
        <h2 id="subtitle">
            <span class="scroll-wrapper">
                <span class="scroll-text">Dyrektor ogłasza nowe plany dla BCU</span>
            </span>
        </h2>
        <h2 id="hours">12:00</h2>
    </div>
    <img src="visuals/obraz.png" id="logo">
    <div id="countdown" aria-hidden="true">
        <svg class="countdown-ring" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
            <circle class="ring-bg" cx="50" cy="50" r="45" fill="none" stroke-width="8" />
            <circle class="ring" cx="50" cy="50" r="45" fill="none" stroke-width="8" stroke-linecap="round" transform="rotate(-90 50 50)" />
        </svg>
        <div class="countdown-text">
            <div id="countdown-number">0</div>
        </div>
    </div>
    <button id="previousButton" class="changeNewsButton"></button>
    <button id="nextButton" class="changeNewsButton"></button>

    <script>
        const isPreview = new URLSearchParams(window.location.search).get('preview') === 'true';

        let lastId = 0;
        let hideTimer = null;
        let nextTimer = null;
        const newsHistory = [];
        let currentNewsIndex = -1;

        function updateWeatherWidget(weather) {
            const widget = document.getElementById('weatherWidget');
            if (!weather) {
                widget.classList.add('hidden');
                return;
            }
            widget.classList.remove('hidden');
            document.getElementById('weatherIcon').textContent = weather.icon;
            document.getElementById('weatherTemp').textContent = weather.temperature + '°C';
            document.getElementById('weatherDesc').textContent = weather.description;
        }

        function showNewsElements() {
            document.getElementById('textContent').style.display = '';
        }

        let countdownInterval = null;
        let countdownRemaining = 0;
        let countdownTotal = 0;
        const ring = document.querySelector('#countdown .ring');
        const numberEl = document.getElementById('countdown-number');
        const RADIUS = 45;
        const CIRC = 2 * Math.PI * RADIUS;

        if (ring) {
            ring.style.strokeDasharray = CIRC;
            ring.style.strokeDashoffset = CIRC;
        }

        const mainVideo = document.getElementById('mainVideo');
        if (mainVideo) {
            mainVideo.addEventListener('error', () => console.log('video error object:', mainVideo.error));
            mainVideo.addEventListener('canplay', () => console.log('video canplay, readyState=', mainVideo.readyState));
            mainVideo.addEventListener('loadeddata', () => console.log('video loadeddata'));
        }

        function startCountdown(totalSeconds) {
            stopCountdown();
            if (!ring) return;
            countdownTotal = Math.max(1, Math.floor(totalSeconds));
            countdownRemaining = countdownTotal;
            updateCountdownDisplay();
            countdownInterval = setInterval(() => {
                countdownRemaining -= 1;
                if (countdownRemaining < 0) {
                    stopCountdown();
                    return;
                }
                updateCountdownDisplay();
            }, 1000);
        }

        function stopCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        function updateCountdownDisplay() {
            if (!ring) return;
            const pct = countdownTotal > 0 ? (countdownRemaining / countdownTotal) : 0;
            const offset = CIRC * (1 - pct);
            ring.style.strokeDashoffset = offset;
            numberEl.textContent = Math.max(0, countdownRemaining).toString();
        }

        function updateClock() {
            const el = document.getElementById('hours');
            if (!el) return;
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            el.textContent = hh + ':' + mm;
        }
        if (!isPreview) {
            updateClock();
            setInterval(updateClock, 1000);
        }

        function hideNewsElements() {
            document.getElementById('textContent').style.display = 'none';
            stopCountdown();
            const mv = document.getElementById('mainVideo');
            if (mv) {
                try { mv.pause(); mv.currentTime = 0; mv.style.display = 'none'; } catch(e) { console.log('hide video error', e); }
            }
        }

        function checkScroll(elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const wrapper = element.querySelector('.scroll-wrapper');
            if (!wrapper) return;
            
            const textSpan = wrapper.querySelector('.scroll-text');
            if (!textSpan) return;
            
            const existingClones = wrapper.querySelectorAll('.scroll-text.clone');
            existingClones.forEach(c => c.remove());
            
            const isOverflowing = element.scrollWidth > element.clientWidth;

            if (isOverflowing) {
                const clone = textSpan.cloneNode(true);
                clone.classList.add('clone');
                wrapper.appendChild(clone);
                element.classList.add('scroll-active');
            } else {
                element.classList.remove('scroll-active');
            }
        }

        function checkTitleScroll() {
            checkScroll('mainTitle');
        }

        function checkSubtitleScroll() {
            checkScroll('subtitle');
        }

        function updateNews(data) {
            let image = document.getElementById("mainImage");
            let video = document.getElementById("mainVideo");
            let question = document.getElementById("question");
            let textContent = document.getElementById("textContent");
            const title = document.getElementById("mainTitle");
            const subtitle = document.getElementById("subtitle");
            let logo = document.getElementById("logo");
            console.log('updateNews', data);
            
            if (data.type == "zdjecie") {
                title.style.display = "block";
                subtitle.style.display = "block";
                video.style.display = "none";
                question.style.display = "none";
                image.style.display = "block";
                image.src = 'visuals/' + data.file;
            } else if (data.type == "wideo") {
                title.style.display = "block";
                subtitle.style.display = "block";
                image.style.display = "none";
                question.style.display = "none";
                if (!video) { console.log('no video element'); }
                else {
                    let file = data.file || '';
                    if (file && file.indexOf('/') === -1 && !file.match(/^(https?:)?\/\//)) file = 'visuals/' + file;
                    let src = video.querySelector('source');
                    if (!src) { src = document.createElement('source'); video.appendChild(src); }
                    src.src = file;
                    src.type = 'video/mp4';
                    video.load();
                    video.muted = true;
                    video.volume = 1;
                    video.style.display = 'block';
                    video.style.objectPosition = 'center center';
                    video.play();
                }
            } else if (data.type == "pytanie_testowe") {
                video.style.display = "none";
                image.style.display = "none";
                title.style.display = "none";
                subtitle.style.display = "none";
                question.style.display = "block";
                let questionText = document.getElementById("questionText");
                if (questionText) {
                    questionText.textContent = data.question || '';
                }
                let options = ['A', 'B', 'C', 'D'];
                for (let option of options) {
                    let optionElement = document.getElementById("answer" + option);
                    if (optionElement) {
                        optionElement.classList.remove('correctAnswer', 'wrongAnswer');
                        optionElement.classList.add('answer');
                        let answerText = data.options && data.options[option] || '';
                        optionElement.textContent = option + ". " + answerText;
                    }
                }

            } else {
                console.log("Nieobslugiwany format pliku")
            }
            
            const titleSpan = title.querySelector('.scroll-text');
            if (titleSpan) {
                titleSpan.textContent = data.title;
            }
            
            const subtitleSpan = subtitle.querySelector('.scroll-text');
            if (subtitleSpan) {
                subtitleSpan.textContent = data.subtitle;
            }
            
            showNewsElements();

            requestAnimationFrame(() => {
                checkTitleScroll();
                checkSubtitleScroll();
            });

            if (hideTimer) clearTimeout(hideTimer);
            if (nextTimer) clearTimeout(nextTimer);

            const duration = Math.max(1, parseInt(data.time) || 5);
            startCountdown(duration);

            if (data.type == "pytanie_testowe") {
                hideTimer = setTimeout(() => {
                    const correctAnswer = String(data.correctAnswer || '').trim().toUpperCase();
                    const options = ['A', 'B', 'C', 'D'];

                    for (let option of options) {
                        const optionElement = document.getElementById("answer" + option);
                        if (!optionElement) continue;
                        optionElement.classList.remove('answer');
                        if (option === correctAnswer)
                            optionElement.classList.add('correctAnswer');
                        else
                            optionElement.classList.add('wrongAnswer');
                    }

                    startCountdown(5);
                    nextTimer = setTimeout(() => {
                        hideNewsElements();
                        loadNews();
                    }, 5000);
                }, duration * 1000);
            } else {
                hideTimer = setTimeout(() => {
                    hideNewsElements();
                }, duration * 1000);

                nextTimer = setTimeout(() => {
                    loadNews();
                }, duration * 1000);
            }
        }

        if (!isPreview) {
            requestAnimationFrame(() => {
                checkTitleScroll();
                checkSubtitleScroll();
            });
        }

        async function loadWeatherFirst() {
            try {
                let response = await fetch('getWeather.php', { cache: 'no-store' });
                let data = await response.json();
                if (data && !data.error) {
                    updateWeatherWidget(data);
                } else {
                    updateWeatherWidget(null);
                }
            } catch (e) {
                console.log('pogoda init error', e);
            }
        }

        async function loadNews() {
            if (currentNewsIndex < newsHistory.length - 1) {
                currentNewsIndex += 1;
                updateNews(newsHistory[currentNewsIndex]);
                return;
            }

            try {
                let response = await fetch(`getNews.php?after=${lastId}`);
                let data = await response.json();
                if (data && !data.error) {
                    if (newsHistory.some((news) => news.id === data.id)) {
                        currentNewsIndex = 0;
                        updateNews(newsHistory[currentNewsIndex]);
                        return;
                    }
                    lastId = data.id;
                    newsHistory.push(data);
                    currentNewsIndex = newsHistory.length - 1;
                    updateNews(data);
                } else {
                    if (nextTimer) clearTimeout(nextTimer);
                    nextTimer = setTimeout(loadNews, 5000);
                }
            } catch (e) {
                if (nextTimer) clearTimeout(nextTimer);
                nextTimer = setTimeout(loadNews, 5000);
            }
        }

        function showPreviousNews() {
            if (currentNewsIndex <= 0) {
                return;
            }

            if (hideTimer) {
                clearTimeout(hideTimer);
                hideTimer = null;
            }
            if (nextTimer) {
                clearTimeout(nextTimer);
                nextTimer = null;
            }

            currentNewsIndex -= 1;
            hideNewsElements();
            updateNews(newsHistory[currentNewsIndex]);
        }

        function skipToNextNews() {
            if (hideTimer) clearTimeout(hideTimer);
            if (nextTimer) clearTimeout(nextTimer);
            hideTimer = null;
            nextTimer = null;
            hideNewsElements();
            loadNews();
        }

        if (!isPreview) {
            setInterval(loadWeatherFirst, 300000);
            hideNewsElements();
            loadWeatherFirst();
            loadNews();

            let prevButton = document.getElementById('previousButton');
            let nextButton = document.getElementById('nextButton');
            document.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    showPreviousNews();
                } else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    skipToNextNews();
                }
            });
            prevButton.addEventListener('click', showPreviousNews);
            nextButton.addEventListener('click', skipToNextNews);
        } else {
            document.getElementById('weatherWidget').classList.remove('hidden');
        }
    </script>
</body>
</html>
